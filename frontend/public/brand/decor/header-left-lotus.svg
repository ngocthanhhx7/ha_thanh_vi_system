  <path d="M49 37 V49" stroke="#FBF5E9" stroke-opacity="0.95" stroke-width="1.1" stroke-linecap="round" />
  <path d="M45 40 C46 43 48 47 48 48" stroke="#FBF5E9" stroke-opacity="0.65" stroke-width="0.75" stroke-linecap="round" />
  <path d="M53 40 C52 43 50 47 50 48" stroke="#FBF5E9" stroke-opacity="0.65" stroke-width="0.75" stroke-linecap="round" />

