name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run dev
      - name: Validate AWS containers and Compose
        run: |
          cp deploy/aws/.env.production.example deploy/aws/.env.production
          docker compose -f compose.production.yml config --quiet
          docker build --target api -t htv-api:ci .
          docker build --target web -t htv-web:ci .
          docker run --rm htv-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Check commit convention
        run: |
          git rev-list HEAD | while read commit; do
            git show -s --format=%B "$commit" | npx --no -- commitlint
          done
