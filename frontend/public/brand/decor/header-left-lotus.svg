  <!-- Stamen seed dots on carpel -->
  <circle cx="46.5" cy="33" r="0.9" fill="#8C5E1E" />
  <circle cx="49" cy="32" r="0.9" fill="#8C5E1E" />
  <circle cx="51.5" cy="33" r="0.9" fill="#8C5E1E" />
  <circle cx="45.5" cy="36" r="0.9" fill="#8C5E1E" />
  <circle cx="49" cy="35.5" r="0.9" fill="#8C5E1E" />
  <circle cx="52.5" cy="36" r="0.9" fill="#8C5E1E" />
  <circle cx="47.5" cy="38" r="0.9" fill="#8C5E1E" />
  <circle cx="50.5" cy="38" r="0.9" fill="#8C5E1E" />

