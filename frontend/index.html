<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#791f26" />
    <meta
      name="description"
      content="Hà Thành Vị — Vị xưa tinh hoa trong từng chiếc bánh. Khám phá bánh chả và những món quà mang hương vị Hà Nội."
    />
    <link rel="icon" href="/brand/logo.png" />
    <link
      rel="preload"
      href="/brand/fonts/noto-serif-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/brand/fonts/noto-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/brand/fonts/archivo-expanded-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/brand/fonts/archivo-expanded-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Discover the home hero before the route chunk loads, without downloading it on other routes.
      if (window.location.pathname === '/') {
        const hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.href = '/brand/product/traditional-1080.webp';
        hero.imageSrcset =
          '/brand/product/traditional-640.webp 640w, /brand/product/traditional-1080.webp 1080w';
        hero.imageSizes = '(max-width: 640px) calc(100vw - 54px), (max-width: 1600px) 44vw, 680px';
        hero.fetchPriority = 'high';
        document.head.append(hero);
      }
    </script>
    <title>Hà Thành Vị — Vị xưa tinh hoa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
