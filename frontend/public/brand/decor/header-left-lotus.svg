<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none">
  <!-- Corner decorative panel in deep burgundy (#461F21) with an organic curved inner edge -->
  <path d="M0 0 H88 C80 14 74 26 66 40 C58 56 56 68 63 82 C69 94 75 104 78 112 H0 V0 Z" fill="#461F21" />

